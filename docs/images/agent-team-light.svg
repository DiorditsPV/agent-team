<linearGradient id="chg" gradientUnits="userSpaceOnUse" x1="452" x2="548" y1="0" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#0fb5c9"/></linearGradient>
<linearGradient id="gb" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#1f7a45"/><stop offset=".3" stop-color="#1f7a45"/><stop offset=".3" stop-color="#2fa35c"/><stop offset="1" stop-color="#2fa35c"/></linearGradient>
<linearGradient id="pb" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#6a48d4"/><stop offset=".3" stop-color="#6a48d4"/><stop offset=".3" stop-color="#8f6ef2"/><stop offset="1" stop-color="#8f6ef2"/></linearGradient>
