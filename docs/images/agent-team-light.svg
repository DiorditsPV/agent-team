<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-label="agent-team: you talk only to the manager; the manager and the roles (developer, reviewer, writer) run in one tmux session; the manager sends a task over SendMessage, the role commits and reports, the manager verifies and merges to main; role sessions are disposable; state lives in git and the tracker">
<title>agent-team: you talk only to the manager; the manager and the roles (developer, reviewer, writer) run in one tmux session; the manager sends a task over SendMessage, the role commits and reports, the manager verifies and merges to main; role sessions are disposable; state lives in git and the tracker</title>
<style>
text { font-family: ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; fill: #111111; }
.nd { font-size: 22px; }
