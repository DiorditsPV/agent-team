<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" aria-label="You talk to the manager; roles sit in tmux panes next to it, each with its own worktree and tool list; state lives in git and the tracker">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 28px; }
    .t { fill: #e6edf3; }
    .s { fill: #9198a1; }
    .b { font-weight: 600; }
    .a { fill: #4493f8; }
    .box { fill: #151b23; stroke: #3d444d; stroke-width: 2; }
    .frame { fill: none; stroke: #9198a1; stroke-width: 2; }
    .acc { fill: #0c2d57; stroke: #4493f8; stroke-width: 2.5; }
    .ln { fill: none; stroke: #9198a1; stroke-width: 2.5; }
    .al { fill: none; stroke: #4493f8; stroke-width: 3; }
    .hd { fill: #4493f8; }
    .hn { fill: #9198a1; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hn" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- you -->
  <rect class="box" x="6" y="185" width="100" height="70" rx="10"/>
  <text class="t b" x="56" y="230" text-anchor="middle">you</text>
  <line class="al" x1="106" y1="220" x2="168" y2="220" marker-end="url(#ah)"/>

  <!-- tmux window -->
  <rect class="frame" x="170" y="10" width="620" height="380" rx="8"/>
  <text class="s" x="190" y="44">tmux</text>
  <line class="ln" x1="170" y1="58" x2="790" y2="58"/>

  <!-- manager pane -->
  <rect class="acc" x="170" y="58" width="290" height="332"/>
  <text class="a b" x="315" y="160" text-anchor="middle">manager</text>
  <text class="s" x="315" y="220" text-anchor="middle">assigns</text>
  <text class="s" x="315" y="260" text-anchor="middle">verifies</text>
  <text class="s" x="315" y="300" text-anchor="middle">merges</text>

  <!-- role panes -->
  <rect class="box" x="460" y="58" width="330" height="110"/>
  <text class="t b" x="625" y="104" text-anchor="middle">developer</text>
  <text class="s" x="625" y="144" text-anchor="middle">worktree · tools</text>

  <rect class="box" x="460" y="168" width="330" height="111"/>
  <text class="t b" x="625" y="214" text-anchor="middle">reviewer</text>
  <text class="s" x="625" y="254" text-anchor="middle">worktree · tools</text>

  <rect class="box" x="460" y="279" width="330" height="111"/>
  <text class="t b" x="625" y="325" text-anchor="middle">writer</text>
  <text class="s" x="625" y="365" text-anchor="middle">worktree · tools</text>

  <!-- manager to roles -->
  <line class="al" x1="400" y1="113" x2="456" y2="113" marker-end="url(#ah)"/>
  <line class="al" x1="400" y1="223" x2="456" y2="223" marker-end="url(#ah)"/>
  <line class="al" x1="400" y1="334" x2="456" y2="334" marker-end="url(#ah)"/>

  <!-- state outside the agents -->
  <line class="ln" x1="315" y1="392" x2="315" y2="438" marker-start="url(#an)" marker-end="url(#an)"/>
  <line class="ln" x1="625" y1="392" x2="625" y2="438" marker-start="url(#an)" marker-end="url(#an)"/>
  <rect class="box" x="170" y="440" width="620" height="80" rx="10"/>
  <text class="t b" x="480" y="490" text-anchor="middle">git + tracker: the state</text>
</svg>
