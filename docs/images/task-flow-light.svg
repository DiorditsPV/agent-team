<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Path of a task: the manager assigns it, the role works on its own branch and reports, the manager checks the commit and tests, then fast-forwards main or returns the work">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 28px; }
    .t { fill: #1f2328; }
    .s { fill: #59636e; }
    .b { font-weight: 600; }
    .a { fill: #0969da; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 2; }
    .acc { fill: #ddf4ff; stroke: #0969da; stroke-width: 2.5; }
    .lane { fill: none; stroke: #d1d9e0; stroke-width: 2; stroke-dasharray: 6 6; }
    .ln { fill: none; stroke: #59636e; stroke-width: 2.5; }
    .dl { fill: none; stroke: #59636e; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .hn { fill: #59636e; }
  </style>
  <defs>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hn" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- lanes -->
  <text class="s b" x="200" y="38" text-anchor="middle">manager</text>
  <text class="s b" x="600" y="38" text-anchor="middle">role</text>
  <line class="lane" x1="400" y1="14" x2="400" y2="550"/>

  <!-- 1 -->
  <rect class="box" x="20" y="64" width="360" height="70" rx="10"/>
  <text class="t" x="200" y="109" text-anchor="middle">assigns a task</text>
  <!-- 2 -->
  <rect class="box" x="420" y="164" width="360" height="70" rx="10"/>
  <text class="t" x="600" y="209" text-anchor="middle">works on its branch</text>
  <!-- 3 -->
  <rect class="box" x="420" y="264" width="360" height="70" rx="10"/>
  <text class="t" x="600" y="309" text-anchor="middle">commits, reports</text>
  <!-- 4 -->
  <rect class="box" x="20" y="364" width="360" height="70" rx="10"/>
  <text class="t" x="200" y="409" text-anchor="middle">checks commit, tests</text>
  <!-- 5 -->
  <rect class="acc" x="20" y="470" width="360" height="70" rx="10"/>
  <text class="a b" x="200" y="515" text-anchor="middle">fast-forward main</text>

  <path class="ln" d="M380,99 H540 V160" marker-end="url(#an)"/>
  <line class="ln" x1="600" y1="234" x2="600" y2="260" marker-end="url(#an)"/>
  <path class="ln" d="M540,334 V399 H384" marker-end="url(#an)"/>
  <line class="ln" x1="200" y1="434" x2="200" y2="466" marker-end="url(#an)"/>
  <!-- not accepted: back to the role -->
  <path class="dl" d="M300,364 V199 H416" marker-end="url(#an)"/>
  <text class="s" x="284" y="290" text-anchor="end">return</text>
</svg>
