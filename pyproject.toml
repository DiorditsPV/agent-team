[project]
name = "agent-team"
version = "0.2.0"
description = "A team of Claude Code agents in tmux: you talk to one manager; roles are permanent, sessions are disposable — state lives in git and your tracker, not in the agent's context."
readme = "README.md"
license = "MIT"
authors = [{name = "Pavel Diordits"}]
keywords = ["claude-code", "agents", "tmux", "multi-agent", "cli"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/DiorditsPV/agent-team"
Repository = "https://github.com/DiorditsPV/agent-team"

[project.scripts]
team = "agent_team.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_team"]

# Библиотека общих ролей ставится с пакетом: agent_team/library ищется от пакета, а не от репозитория.
[tool.hatch.build.targets.wheel.force-include]
"roles" = "agent_team/library"

[tool.pytest.ini_options]
testpaths = ["tests"]
